name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check alembic app tests

      - name: Format check (ruff)
        run: ruff format --check alembic app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      # Guards against a model change landing without a matching revision:
      # applies every migration to a throwaway database, then asserts that
      # autogenerate finds nothing left to do. Keys are generated per run — no
      # key-shaped literal is ever committed, not even a disposable one.
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          export MASTER_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          alembic upgrade head
          alembic check

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crypto-trading-hub:ci .
