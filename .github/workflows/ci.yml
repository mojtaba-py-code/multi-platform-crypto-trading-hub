name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets the full pipeline be re-run from the Actions tab without an empty
  # commit — useful after a dependency advisory lands, since the audit result
  # can change with no code change at all.
  workflow_dispatch:

# Least privilege by default: no job may write to the repository unless it
# opts in explicitly. A compromised third-party action then cannot push code,
# publish releases, or open pull requests with the workflow token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check alembic app tests

      - name: Format check (ruff)
        run: ruff format --check alembic app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      # Guards against a model change landing without a matching revision:
      # applies every migration to a throwaway database, then asserts that
      # autogenerate finds nothing left to do. Keys are generated per run — no
      # key-shaped literal is ever committed, not even a disposable one.
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          export MASTER_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          alembic upgrade head
          alembic check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later "removed" is
          # still in the pack files and still compromised. Scanning only the
          # tip would miss exactly the case that matters.
          fetch-depth: 0

      # The MIT-licensed CLI, pinned by version, rather than the Action wrapper
      # (which gates organisation accounts behind a licence key).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps any match out of the build log, so a leak is reported
      # without the CI output itself becoming a second copy of the secret.
      - name: Scan commit history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      # Fails the build on any dependency with a known CVE in the Python
      # Packaging Advisory Database.
      - name: Audit installed packages (pip-audit)
        run: pip-audit --strict --progress-spinner off

      # The environment above is resolved from the ranges in pyproject.toml.
      # What actually ships is the pinned lock, so audit that too — a CVE in a
      # version the lock pins would otherwise be missed entirely.
      - name: Audit the pinned runtime lock
        run: pip-audit --strict --progress-spinner off -r requirements.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, secrets, audit]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crypto-trading-hub:ci .
