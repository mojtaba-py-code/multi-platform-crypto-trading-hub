# GitHub's static analysis engine. Complements the checks in ci.yml: ruff's
# "S" ruleset (Bandit) catches insecure API usage at the statement level, while
# CodeQL does inter-procedural taint tracking — it follows untrusted request
# data through the service layer into a sink, which a linter cannot see.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so a newly published query pattern is applied to code that has
    # not changed since it was written.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          # The default suite, which is every security query. The quality half
          # of security-and-quality was the only thing this repository ran that
          # the others do not, and all 25 alerts it raised were false: the `...`
          # bodies of @abstractmethod declarations read as ineffectual
          # statements, Alembic's required revision globals as unused, an import
          # guarded by TYPE_CHECKING as a runtime cycle, and alembic/env.py's
          # deliberate model import — already marked `# noqa: F401`, and
          # load-bearing, since dropping it breaks autogenerate silently.
          # Keeping them would train the eye to scroll past this tab, which is
          # the one place a real finding has to be noticed.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:python"
