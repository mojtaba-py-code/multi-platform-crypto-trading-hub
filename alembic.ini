# Alembic configuration. The database URL is injected at runtime from the
# application settings (see alembic/env.py), so it is intentionally blank here.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Newly generated revisions are linted and formatted in place. ``exec`` is used
# rather than ``console_scripts`` so the hook resolves ruff from PATH instead of
# requiring it to be installed as an entry point in Alembic's own environment.
[post_write_hooks]
hooks = ruff_check,ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
