# Reverse proxy for the Crypto Trading Hub API.
# In production, terminate TLS here (see the commented 443 server block) and
# redirect HTTP to HTTPS.

upstream cth_api {
    server api:8000;
}

# Basic per-IP rate limiting at the edge (defence in depth on top of the app).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Security headers (the app also sets these; belt and braces).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    location /api/v1/health {
        proxy_pass http://cth_api;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://cth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

