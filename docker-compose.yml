# Local development / evaluation stack.
#
# Backing services are published on the loopback interface only
# (``127.0.0.1:<port>``). A bare ``"5432:5432"`` binds to 0.0.0.0, which puts
# the database on every interface of the host — including a hotel or café Wi-Fi
# network — behind nothing but the development password below. Loopback binding
# keeps them reachable from your machine and from nowhere else.
#
# For a real deployment see docs/deployment.md: use managed Postgres/Redis, or
# drop the ``ports`` blocks entirely so the services are reachable only over the
# internal compose network.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cth}
      # Development default. Override in .env for anything you care about.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cth}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cth} -d ${POSTGRES_DB:-crypto_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    # ``required: false`` so a fresh clone can `docker compose up` before the
    # operator has written a .env; the app generates ephemeral dev keys.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cth}:${POSTGRES_PASSWORD:-cth}@db:5432/${POSTGRES_DB:-crypto_hub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # nginx terminates the connection, so without this every request would
      # look like it came from the proxy: one shared rate-limit bucket and an
      # audit log full of the proxy's address. Compose networks live in
      # Docker's 172.16/12 range. Narrow this to the proxy's address if you
      # run untrusted workloads on the same network.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cth}:${POSTGRES_PASSWORD:-cth}@db:5432/${POSTGRES_DB:-crypto_hub}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
