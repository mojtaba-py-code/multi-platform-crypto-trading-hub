[project]
name = "crypto-trading-hub"
version = "1.0.0"
description = "Multi-Platform Cryptocurrency Trading Hub — a unified, secure platform to manage trading across multiple exchanges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "celery>=5.4",
    "ccxt>=4.3",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=8.4",
    "structlog>=24.2",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
    # Used by tests/test_repo_hygiene.py to parse the shipped compose and
    # workflow files. Installed transitively anyway, but the tests depend on it
    # directly, so it is declared directly.
    "pyyaml>=6.0",
    # Regenerates the requirements.txt lock; see the header of that file.
    "uv>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite imports its own helpers as ``tests.fakes``. Bare ``pytest``
# prepends the directory holding conftest.py, not the project root, so the
# package is unimportable and every run dies in conftest — but only where
# the command is ``pytest``. ``python -m pytest`` adds the working
# directory and hides it, which is why this passed locally and failed in CI.
pythonpath = ["."]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs ORM work inside greenlets. Without declaring
# that concurrency mode, coverage silently misses lines executed there and
# under-reports the service layer by a wide margin.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
# "token_type" here is the JWT *type* claim ("access"/"refresh"/"bearer"),
# not a credential; S105/S106 are false positives on that identifier.
"app/security/tokens.py" = ["S105", "S106"]
"app/schemas/auth.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
